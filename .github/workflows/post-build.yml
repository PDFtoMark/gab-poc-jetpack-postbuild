name: Post-Build
run-name: Post-Build on ${{ github.event.workflow_run.head_branch }}
on:
  workflow_run:
    types: [ 'completed' ]
    workflows:
      - Build

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  find_artifact:
    name: Find artifact
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    timeout-minutes: 2
    outputs:
      artifact_name: ${{ steps.run.outputs.artifact_name }}
      artifact_filename: ${{ steps.run.outputs.artifact_filename }}
      any_plugins: ${{ steps.run.outputs.any_plugins }}
    steps:
      - name: Find artifact
        id: run
        env:
          TOKEN: ${{ github.token }}
          URL: ${{ github.event.workflow_run.artifacts_url }}
        run: |
          ARTIFACT_NAME=
          ARTIFACT_FILENAME=
          for (( i=1; i<=5; i++ )); do
            [[ $i -gt 1 ]] && sleep 10
            echo "::group::Fetch list of artifacts (attempt $i/5)"
            JSON="$(curl -sS -L --get \
              --header "Authorization: token $TOKEN" \
              --url "$URL"
            )"
            echo "$JSON"
            echo "::endgroup::"

            PLUGINS="$(jq -r '.artifacts[] | select( .name == "plugins.tsv" )' <<<"$JSON")"

            if jq -e '.artifacts[] | select( .name == "jetpack-build.tar.xz" )' <<<"$JSON" &>/dev/null; then
              ARTIFACT_NAME=jetpack-build.tar.xz
              ARTIFACT_FILENAME=jetpack-build.tar.xz
              break
            fi
          done
          [[ -z "$ARTIFACT_NAME" ]] && { echo "::error::Failed to find artifact."; exit 1; }
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "artifact_filename=${ARTIFACT_FILENAME}" >> "$GITHUB_OUTPUT"
          if [[ -z "$PLUGINS" ]]; then
            echo "any_plugins=false" >> "$GITHUB_OUTPUT"
          else
            echo "any_plugins=true" >> "$GITHUB_OUTPUT"
          fi

  prepare_upgrade_test:
    name: Prepare plugin upgrades matrix
    runs-on: ubuntu-latest
    needs: [ find_artifact ]
    if: needs.find_artifact.outputs.any_plugins == 'true'
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    timeout-minutes: 5
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.find_artifact.outputs.artifact_name }}
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/artifact/

      - name: Extract build artifact
        env:
          ARTIFACT_FILENAME: ${{ runner.temp }}/artifact/${{ needs.find_artifact.outputs.artifact_filename }}
        shell: bash
        run: tar --xz -xvvf "$ARTIFACT_FILENAME" build/plugins.tsv

      - name: Prepare matrix
        id: matrix
        run: |
          RET=$( jq -c -s --raw-input 'split( "\n" )[0:-1] | map( split( "\t" ) | { src: .[0], mirror: .[1], slug: .[2] } )' build/plugins.tsv )
          jq '.' <<<"$RET"
          echo "matrix=$RET" >> "$GITHUB_OUTPUT"

  upgrade_test:
    name: Test upgrades for ${{ matrix.slug }}
    runs-on: ubuntu-latest
    needs: [ find_artifact, prepare_upgrade_test ]
    if: needs.find_artifact.outputs.any_plugins == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson( needs.prepare_upgrade_test.outputs.matrix ) }}
    env:
      PLUGIN_SRC: ${{ matrix.src }}
      PLUGIN_MIRROR: ${{ matrix.mirror }}
      PLUGIN_SLUG: ${{ matrix.slug }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.find_artifact.outputs.artifact_name }}
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: ${{ runner.temp }}/artifact/

      - name: Extract build artifact
        env:
          ARTIFACT_FILENAME: ${{ runner.temp }}/artifact/${{ needs.find_artifact.outputs.artifact_filename }}
        shell: bash
        run: tar --xz -xvvf "$ARTIFACT_FILENAME" build

      - uses: actions/checkout@v4
        with:
          path: trunk
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_commit.id }}
          path: commit
          allow-unsafe-pr-checkout: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            ${{ env.PLUGIN_SRC }}/composer.json

      - name: Prepare plugin zips
        run: trunk/.github/files/test-plugin-update/prepare-zips.sh

      - name: Test upgrades
        run: trunk/.github/files/test-plugin-update/test.sh
